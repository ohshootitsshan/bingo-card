<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Wellness Report Preview</title>
<style>
  body {
    background-color: #F4F4F6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111111;
    margin: 0;
    padding: 20px;
  }
  .preview-subject {
    max-width: 560px;
    margin: 0 auto 10px;
    color: #666666;
    font-size: 13px;
  }
  .preview-note {
    max-width: 560px;
    margin: 0 auto 14px;
    color: #555555;
    font-size: 13px;
  }
  .email-container {
    max-width: 560px;
    margin: 0 auto;
    background: #FFFFFF;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .header {
    background: #B7C938;
    color: #FFFFFF;
    text-align: center;
    padding: 24px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px 0;
    letter-spacing: -0.02em;
  }
  .header p {
    font-size: 13px;
    margin: 0;
    opacity: 0.9;
  }
  .header .week-range {
    margin-top: 8px;
    font-weight: 600;
  }
  .summary-banner {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    background: #F8F9FA;
    border-bottom: 1px solid #EAEAEA;
    padding: 16px;
    text-align: center;
  }
  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 64px;
    padding: 8px;
    box-sizing: border-box;
    text-align: center;
  }
  .stat-box:nth-child(odd) {
    border-right: 1px solid #EAEAEA;
  }
  .stat-box:nth-child(n + 3) {
    padding-top: 24px;
    border-top: 1px solid #EAEAEA;
  }
  .stat-value {
    width: 100%;
    font-size: 18px;
    font-weight: 700;
    color: #B7C938;
    margin-bottom: 2px;
    overflow-wrap: anywhere;
  }
  #best-day,
  #most-eaten-meal {
    font-size: 14px;
  }
  #avg-nutrition {
    font-size: 18px;
  }
  .stat-label {
    font-size: 11px;
    color: #666666;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .day-section {
    padding: 20px;
    border-bottom: 1px solid #EAEAEA;
  }
  .day-section:last-child {
    border-bottom: none;
  }
  .day-title {
    font-size: 15px;
    font-weight: 700;
    color: #111111;
    margin-bottom: 10px;
  }
  .log-content {
    background: #FAFAFC;
    border-left: 3px solid #B7C938;
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    line-height: 1.4;
    color: #333333;
    white-space: pre-wrap;
  }
  .footer {
    text-align: center;
    font-size: 11px;
    color: #888888;
    padding: 20px;
    background: #F8F9FA;
  }
  @media (max-width: 420px) {
    body {
      padding: 12px;
    }
    .summary-banner {
      padding: 12px 8px;
    }
    .stat-box {
      padding: 8px 4px;
    }
    .stat-value {
      font-size: 15px;
    }
    .day-section {
      padding: 16px;
    }
  }
</style>
</head>
<body>
<!--
EmailJS template variables supplied by js/theme.js:
  {{to_email}}        Recipient address
  {{subject}}         Email subject
  {{week_range}}      Report date range
  {{total_bingos}}    Bingo days achieved
  {{avg_nutrition}}   Days all goals were met
  {{best_day}}        Best day of the week
  {{most_eaten_meal}} Most frequently logged meal
  {{{nutrition_ring}}} Email-safe table-based vertical nutrition chart HTML
  {{{daily_breakdown}}} Formatted daily activity HTML
Use triple braces for nutrition_ring and daily_breakdown so EmailJS renders their HTML.
-->
<p class="preview-subject" id="subject"></p>
<p class="preview-note" id="preview-note"></p>

<div class="email-container">
  <div class="header">
    <h1>Weekly Wellness &amp; Habit Review</h1>
    <p>Your daily breakdown of habits, nutrition, and symptoms</p>
    <p class="week-range" id="week-range"></p>
  </div>

  <div class="summary-banner">
    <div class="stat-box">
      <div class="stat-value" id="total-bingos"></div>
      <div class="stat-label">⭐ Bingos Achieved</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="avg-nutrition"></div>
      <div class="stat-label">📊 Days All Goals Met</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="best-day"></div>
      <div class="stat-label">🏆 Best Day</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="most-eaten-meal"></div>
      <div class="stat-label">🥗 Most Eaten Meal</div>
    </div>
  </div>

  <div class="day-section">
    <div class="day-title">📊 Goal Progress</div>
    <!-- Copy this section to the EmailJS template; keep triple braces to render its table HTML. -->
    <div id="nutrition-ring"></div>
  </div>

  <div class="day-section">
    <div class="day-title">📅 Daily Activity Breakdown</div>
    <!-- EmailJS template variable: {{{daily_breakdown}}} -->
    <div class="log-content" id="daily-breakdown"></div>
  </div>

  <div class="footer">
    Generated automatically by your personal dashboard ✨
  </div>
</div>

<script src="js/theme.js"></script>
<script>
  'use strict';
  try {
    const params = window.buildWeeklyReportTemplateParams();
    document.getElementById('subject').textContent = `Subject: ${params.subject}`;
    document.getElementById('week-range').textContent = params.week_range;
    document.getElementById('total-bingos').textContent = String(params.total_bingos);
    document.getElementById('avg-nutrition').textContent = String(params.avg_nutrition);
    document.getElementById('best-day').textContent = params.best_day;
    document.getElementById('most-eaten-meal').textContent = params.most_eaten_meal;
    document.getElementById('nutrition-ring').innerHTML = params.nutrition_ring;
    document.getElementById('daily-breakdown').innerHTML = params.daily_breakdown;
    document.getElementById('preview-note').textContent =
      'Preview built from this browser’s saved tracker data using js/theme.js.';
  } catch (error) {
    console.error('Could not build the weekly report preview.', error);
    document.getElementById('preview-note').textContent =
      'Preview could not build the report. Open this file in the same browser profile as your dashboard and check the console for details.';
    document.getElementById('subject').textContent = 'Weekly Wellness Report Preview';
    document.getElementById('week-range').textContent = '';
    document.getElementById('total-bingos').textContent = '—';
    document.getElementById('avg-nutrition').textContent = '—';
    document.getElementById('best-day').textContent = '—';
    document.getElementById('most-eaten-meal').textContent = '—';
    document.getElementById('daily-breakdown').textContent = 'Tracker data is unavailable.';
    document.getElementById('nutrition-ring').textContent = 'Tracker data is unavailable.';
  }
</script>
</body>
</html>
